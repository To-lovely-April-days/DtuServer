# /etc/nginx/sites-available/dtuserver
# 用法见 deploy/README.md。把 cloud.sh-htlab.com 换成你的域名。
#
# 注意：DTU 的裸 TCP 9116 不走这里 —— 它不是 HTTP，设备直连服务器 9116 端口。

# WebSocket 升级用。SignalR（/dtuhub、/dashboardhub）必须要它，否则长连接会被降级成轮询甚至断开。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.sh-htlab.com;

    # certbot --webroot 的验证目录。这一段必须在下面的 301 之前，否则续期会被跳走。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.sh-htlab.com;

    ssl_certificate     /etc/letsencrypt/live/cloud.sh-htlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.sh-htlab.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 设备图片、3D 模型(.glb 几百 KB)、物模型 JSON 上传都要走这里
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # 这四个头决定程序看到的协议和客户端 IP。
        # 程序里已经 UseForwardedHeaders 认了它们，缺一个登录跳转就会掉回 http。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR / WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SignalR 是长连接，默认 60s 会把空闲连接掐掉导致反复重连
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # 实时推送不能缓冲，否则看板数据会一卡一卡的
        proxy_buffering off;
    }
}
