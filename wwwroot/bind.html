<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>绑定设备 · MaxChemical</title>
  <link rel="stylesheet" href="/app.css" />
  <style>.msg{font-size:14px;min-height:20px;margin-top:14px}.msg.ok{color:var(--green-bright)}.msg.bad{color:var(--accent-bright)}</style>
</head>
<body class="app-bg">
  <div class="auth">
    <div class="box">
      <div class="card">
        <div class="logo"><span class="mark">M</span>MaxChemical <b>物联网平台</b></div>
        <h1>绑定设备</h1>
        <div class="sub">扫码或输入设备序列号,绑定后即可监控</div>
        <input class="inp" id="code" placeholder="设备序列号" style="text-align:center;letter-spacing:1px" />
        <button class="btn" id="btn" style="width:100%;margin-top:12px">绑定</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const pre=new URLSearchParams(location.search).get('code');
    if(pre)$('code').value=pre;
    async function ensureLogin(){
      const r=await fetch('/auth/me');
      if(r.status===401){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return false;}
      return true;
    }
    $('btn').addEventListener('click', async ()=>{
      const msg=$('msg'); msg.textContent=''; msg.className='msg';
      const code=$('code').value.trim();
      if(!code){msg.textContent='请输入设备序列号';msg.className='msg bad';return;}
      if(!await ensureLogin())return;
      const r=await fetch('/web/bind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const d=await r.json().catch(()=>({}));
      if(r.ok){msg.textContent=`✅ 已绑定「${d.name}」,2 秒后进入总览`;msg.className='msg ok';setTimeout(()=>location.href='/',2000);}
      else{msg.textContent=d.error||'绑定失败';msg.className='msg bad';}
    });
    if(pre)ensureLogin().then(ok=>{if(ok)$('btn').click();});
  </script>
</body>
</html>
